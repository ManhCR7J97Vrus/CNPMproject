<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập | Kho trung chuyển</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/components.css">
    <script type="module" src="/js/pages/index.js"></script>
</head>
<body>
    <main class="login-view">
        <span class="brand">Kho trung chuyển</span>
        <section class="panel">
            <h1>Đăng nhập</h1>
            <form id="login">
                <label class="field"><span>Tên đăng nhập</span><input name="username" autocomplete="username" required maxlength="255"></label>
                <label class="field"><span>Mật khẩu</span><input name="password" type="password" autocomplete="current-password" required maxlength="72"></label>
                <button type="submit">Đăng nhập</button>
                <div id="feedback" aria-live="polite"></div>
            </form>
            <noscript>Bật JavaScript để đăng nhập.</noscript>
        </section>
    </main>
</body>
</html>
